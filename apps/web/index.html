<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="Self-hosted, open-source collaborative coding pads. Pick a port, share the URL, code together in real time."
    />
    <meta name="theme-color" content="#2563eb" />
    <title>opencoder · collaborative coding pads</title>
    <script>
      // Apply the saved theme synchronously, BEFORE React mounts, to avoid a
      // flash-of-wrong-theme. Mirrors the logic in lib/theme.ts.
      (function () {
        try {
          var stored = localStorage.getItem('oc_theme');
          var resolved =
            stored === 'light' || stored === 'dark'
              ? stored
              : window.matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark';
          document.documentElement.classList.add(resolved);
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
